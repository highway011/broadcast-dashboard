<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Dashboard</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}

.page.active {
    display: block;
}
</style>

</head>
<body>

<iframe
    id="weather"
    class="page active"
    src="https://ws4kp.onrender.com">
</iframe>

<iframe
    id="crew"
    class="page"
    src="https://example.com">
</iframe>

<script>

const weather = document.getElementById("weather");
const crew = document.getElementById("crew");

const weatherTime = 6000;
const crewTime = 6000;

let showingWeather = true;
let rotationStarted = false;

let holdTimer = null;

// Switch pages
function rotate() {

    if (!rotationStarted) return;

    if (showingWeather) {
        weather.classList.remove("active");
        crew.classList.add("active");
        showingWeather = false;

        setTimeout(rotate, crewTime);

    } else {

        crew.classList.remove("active");
        weather.classList.add("active");
        showingWeather = true;

        setTimeout(rotate, weatherTime);

    }

}

// Start rotation after hold
function startRotation() {

    if (rotationStarted) return;

    rotationStarted = true;

    console.log("Rotation Started");

    rotate();

}

// Begin timing when OK/Enter is pressed
document.addEventListener("keydown", (e) => {

    if (e.key === "Enter" && !rotationStarted && holdTimer === null) {

        console.log("Holding OK...");

        holdTimer = setTimeout(startRotation, 3000);

    }

});

// Cancel if released too soon
document.addEventListener("keyup", (e) => {

    if (e.key === "Enter") {

        clearTimeout(holdTimer);
        holdTimer = null;

    }

});

</script>

</body>
</html>
