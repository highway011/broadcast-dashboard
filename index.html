<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Broadcast Dashboard</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;

    opacity: 0;
    z-index: 1;
    pointer-events: none;

    transition: opacity .5s linear;
}

.page.active {
    opacity: 1;
    z-index: 2;
    pointer-events: auto;
}

#schedule {
    background: white;
    object-fit: contain;
    box-sizing: border-box;
    padding: 60px;
}

#map {
    background: black;
    object-fit: contain;
}
</style>
</head>

<body>
    
<!-- <h1 style="color:red;position:absolute;z-index:999999;">NEW VERSION FINAL</h1> -->

<iframe
    id="weather"
    class="page active"
    src="https://ws4kp.onrender.com">
</iframe>

<iframe
    id="crew"
    class="page"
    src="https://broadcaststaff.com/eventCrewListTodayMSST.php">
</iframe>

<img
    id="schedule"
    class="page"
    src="Schedule.png"
    alt="Schedule">

<img
    id="map"
    class="page"
    src="map.png"
    alt="Map">

<script>
const weather = document.getElementById("weather");
const crew = document.getElementById("crew");
const schedule = document.getElementById("schedule");
const map = document.getElementById("map");

const firstWeatherTime = 30000;  // Initial weather: 1 minute
const normalTime = 0;        // Crew: 1 minute
const scheduleTime = 0;      // Schedule: 35 seconds
const mapTime = 0;           // Map: 10 seconds
const weatherReturnTime = 10000; // Weather after schedule: 30 seconds

let currentPage = "weather";

function rotate() {

    if (currentPage === "weather") {

        weather.classList.remove("active");
        crew.classList.add("active");

        currentPage = "crew";

        setTimeout(rotate, normalTime);

    } else if (currentPage === "crew") {

        crew.classList.remove("active");
        schedule.classList.add("active");

        currentPage = "schedule";

        setTimeout(rotate, scheduleTime);

    } else if (currentPage === "schedule") {

        schedule.classList.remove("active");
        map.classList.add("active");

        currentPage = "map";

        setTimeout(rotate, mapTime);

    } else {

        map.classList.remove("active");
        weather.classList.add("active");

        currentPage = "weather";

        setTimeout(rotate, weatherReturnTime);
    }
}

// First weather display lasts one minute
setTimeout(rotate, firstWeatherTime);
</script>

</body>
</html>
