<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Broadcast Dashboard</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.page {
    position: absolute;
    inset: 0;
    border: none;

    opacity: 0;
    z-index: 1;
    pointer-events: none;

    transition: opacity .5s linear;
}

.page.active {
    opacity: 1;
    z-index: 2;
    pointer-events: auto;
}

.schedule-page {
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
}

.schedule-page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>
</head>

<body>

<iframe
    id="weather"
    class="page active"
    src="https://ws4kp.onrender.com">
</iframe>

<iframe
    id="crew"
    class="page"
    src="https://broadcaststaff.com/eventCrewListTodayMSST.php">
</iframe>

<div id="schedule" class="page schedule-page">
    <img src="schedule.png" alt="Schedule">
</div>

<script>
const slides = [
    {
        id: "weather",
        duration: 120000 // first weather: 2 minutes
    },
    {
        id: "crew",
        duration: 60000 // crew: 1 minute
    },
    {
        id: "schedule",
        duration: 30000 // schedule PNG: 30 seconds
    },
    {
        id: "weather",
        duration: 60000 // normal weather after first time: 1 minute
    }
];

let currentSlide = 0;

function showSlide(index) {
    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document.getElementById(slides[index].id).classList.add("active");
}

function rotate() {
    currentSlide++;

    if (currentSlide >= slides.length) {
        currentSlide = 1; 
        // skips the 2-minute weather after startup
        // goes back to crew, schedule, normal weather loop
    }

    showSlide(currentSlide);

    setTimeout(rotate, slides[currentSlide].duration);
}

setTimeout(rotate, slides[currentSlide].duration);
</script>

</body>
</html>
