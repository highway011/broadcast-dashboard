<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Dashboard</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}

.page.active {
    display: block;
}
</style>

</head>
<body>

<iframe
    id="weather"
    class="page active"
    src="https://ws4kp.onrender.com">
</iframe>

<iframe
    id="crew"
    class="page"
    src="https://example.com">
</iframe>

<script>

const weather = document.getElementById("weather");
const crew = document.getElementById("crew");

const weatherTime = 6000; // 60 seconds
const crewTime = 6000;    // 60 seconds

let showingWeather = true;

function rotate() {

    if (showingWeather) {

        weather.classList.remove("active");
        crew.classList.add("active");

        showingWeather = false;

        setTimeout(rotate, crewTime);

    } else {

        crew.classList.remove("active");
        weather.classList.add("active");

        showingWeather = true;

        setTimeout(rotate, weatherTime);

    }

}

setTimeout(rotate, weatherTime);

</script>

</body>
</html>
