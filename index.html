<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Broadcast Dashboard</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}

.page.active {
    display: block;
}
</style>
</head>

<body>

<iframe
    id="weather"
    class="page active"
    src="https://ws4kp.onrender.com">
</iframe>

<iframe
    id="crew"
    class="page"
    src="https://example.com">
</iframe>

<script>
const weather = document.getElementById("weather");
const crew = document.getElementById("crew");

const firstWeatherTime = 120000; // Initial weather: 2 minutes
const normalTime = 60000;        // Every page afterward: 1 minute

let showingWeather = true;

function rotate() {
    if (showingWeather) {
        // Weather to crew
        weather.classList.remove("active");
        crew.classList.add("active");
        showingWeather = false;
    } else {
        // Crew to weather
        crew.classList.remove("active");
        weather.classList.add("active");
        showingWeather = true;
    }

    // Every rotation after startup lasts one minute
    setTimeout(rotate, normalTime);
}

// Only the first weather appearance lasts two minutes
setTimeout(rotate, firstWeatherTime);
</script>

</body>
</html>
