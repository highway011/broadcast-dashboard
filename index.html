<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Broadcast Dashboard</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;

    opacity: 0;
    z-index: 1;
    pointer-events: none;

    transition: opacity .5s linear;
}

.page.active {
    opacity: 1;
    z-index: 2;
    pointer-events: auto;
}

#schedule {
    background: black;
}

#schedule img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>
</head>

<body>

<iframe
    id="weather"
    class="page active"
    src="https://ws4kp.onrender.com">
</iframe>

<iframe
    id="crew"
    class="page"
    src="https://broadcaststaff.com/eventCrewListTodayMSST.php">
</iframe>

<div
    id="schedule"
    class="page">
    <img src="schedule.png" alt="Schedule">
</div>

<script>
const weather = document.getElementById("weather");
const crew = document.getElementById("crew");
const schedule = document.getElementById("schedule");

const firstWeatherTime = 10000; // Initial weather: 2 minutes
const normalTime = 10000;        // Weather/Crew: 1 minute
const scheduleTime = 10000;      // Schedule: 30 seconds

let currentPage = "weather";

function rotate() {

    if (currentPage === "weather") {
        weather.classList.remove("active");
        crew.classList.add("active");

        currentPage = "crew";

        setTimeout(rotate, normalTime);
    }

    else if (currentPage === "crew") {
        crew.classList.remove("active");
        schedule.classList.add("active");

        currentPage = "schedule";

        setTimeout(rotate, scheduleTime);
    }

    else {
        schedule.classList.remove("active");
        weather.classList.add("active");

        currentPage = "weather";

        setTimeout(rotate, normalTime);
    }
}

// First weather display lasts two minutes
setTimeout(rotate, firstWeatherTime);
</script>

</body>
</html>
