<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Dashboard</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<iframe id="display"></iframe>

<script>
const pages = [
  {
    url: "https://ws4kp.onrender.com",
    duration: 60000
  }
];

const frame = document.getElementById("display");

frame.src = pages[0].url;

</script>

</body>
</html>
