<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Broadcast Dashboard</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;

    opacity: 0;
    z-index: 1;
    pointer-events: none;

    transition: opacity .5s linear;
}

.page.active {
    opacity: 1;
    z-index: 2;
    pointer-events: auto;
}
</style>
</head>

<body>

<iframe
    id="weather"
    class="page active"
    src="https://ws4kp.onrender.com">
</iframe>

<iframe
    id="crew"
    class="page"
    src="https://broadcaststaff.com/eventCrewListTodayMSST.php">
</iframe>

<script>
const weather = document.getElementById("weather");
const crew = document.getElementById("crew");

const firstWeatherTime = 5000; // Initial weather: 2 minutes
const normalTime = 5000;        // Every page afterward: 1 minute

let showingWeather = true;

function rotate() {

    if (showingWeather) {
        weather.classList.remove("active");
        crew.classList.add("active");
    } else {
        crew.classList.remove("active");
        weather.classList.add("active");
    }

    showingWeather = !showingWeather;

    setTimeout(rotate, normalTime);
}
    // First weather display lasts two minutes
setTimeout(rotate, firstWeatherTime);
</script>

</body>
</html>
